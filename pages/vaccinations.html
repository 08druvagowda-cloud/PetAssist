<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Vaccinations — PetAssist</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/store.js"></script>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="../index.html" class="nav-logo">
                <span class="lp-brand-mark"><i class="fas fa-paw"></i></span>
                <span>PetAssist</span>
                <span class="lp-webapp-pill">Web App</span>
            </a>
            <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
                <span class="hamburger"></span>
            </button>
            <ul class="nav-menu" id="navMenu">
                <li><a href="../index.html" class="nav-link"><i class="fas fa-home"></i> Home</a></li>
                <li><a href="dashboard.html" class="nav-link"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
                <li><a href="pets.html" class="nav-link"><i class="fas fa-dog"></i> My Pets</a></li>
                <li><a href="vaccinations.html" class="nav-link active"><i class="fas fa-syringe"></i> Vaccinations</a></li>
                <li><a href="health.html" class="nav-link"><i class="fas fa-heartbeat"></i> Health</a></li>
                <li><a href="care-center.html" class="nav-link"><i class="fas fa-hands-helping"></i> Care Center</a></li>
                <li><a href="lost-found.html" class="nav-link"><i class="fas fa-search"></i> Lost & Found</a></li>
                <li><a href="guide.html" class="nav-link"><i class="fas fa-book"></i> Guide</a></li>
                <li class="nav-user-section" id="nav-user-slot">
                    <a href="javascript:void(0)" onclick="Store.logout()" class="nav-link nav-logout"><i class="fas fa-sign-out-alt"></i> Logout</a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container" style="padding-top:20px;">
        <div class="page-header" style="display:flex; justify-content:space-between; align-items:flex-end;">
            <div>
                <h1>Predictive Immunization Scheduler</h1>
                <p>Automated booster intervals and compliance alerts for pets and farm animals.</p>
            </div>
            <button class="btn btn-primary" onclick="document.getElementById('addVaccCard').style.display='block'">
                <i class="fas fa-plus"></i> Add Vaccine Record
            </button>
        </div>

        <div class="glass-card-static mb-32" id="addVaccCard" style="display:none; max-width:620px;">
            <h3 class="section-title"><i class="fas fa-syringe"></i> Log Vaccination</h3>
            <form id="vaccForm">
                <div class="form-group">
                    <label>Select Animal</label>
                    <select id="v_pet" class="form-control" required></select>
                </div>
                <div class="form-group">
                    <label>Vaccine Protocol</label>
                    <select id="v_type" class="form-control">
                        <option value="Rabies|365">Rabies (Annual Core — 365 days)</option>
                        <option value="Parvovirus / DHPP|365">DHPP / Parvovirus (365 days)</option>
                        <option value="Bordetella|180">Bordetella / Kennel Cough (180 days)</option>
                        <option value="FMD (Foot & Mouth)|180">FMD for Cattle/Sheep (180 days)</option>
                        <option value="Brucellosis|365">Brucellosis (365 days)</option>
                        <option value="Clostridial Diseases|180">Clostridial Diseases / Enterotoxaemia (180 days)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Administration Date</label>
                    <input type="date" id="v_last_date" class="form-control" required>
                </div>
                <div style="display:flex; gap:10px; margin-top:14px;">
                    <button type="submit" class="btn btn-primary"><i class="fas fa-calculator"></i> Compute &amp; Save</button>
                    <button type="button" class="btn btn-secondary" onclick="document.getElementById('addVaccCard').style.display='none'">Cancel</button>
                </div>
            </form>
        </div>

        <div class="glass-card-static">
            <h3 class="section-title"><i class="fas fa-shield-alt"></i> Immunization Records</h3>
            <div id="vaccList"></div>
        </div>
    </div>

    <!-- Core Scripts -->
    <script src="../js/main.js"></script>
    <script src="../js/ai-assistant.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const pets = Store.getAll('pets');
            const petSelect = document.getElementById('v_pet');
            if (petSelect) {
                if (pets.length === 0) {
                    petSelect.innerHTML = '<option value="">No pets registered</option>';
                } else {
                    petSelect.innerHTML = pets.map(p => `<option value="${p.id}">${p.pet_name} (${p.type || p.species || 'Animal'})</option>`).join('');
                }
            }

            function computeDue(lastDateStr, intervalDays) {
                const last = new Date(lastDateStr);
                const due = new Date(last.getTime() + intervalDays * 24 * 60 * 60 * 1000);
                const now = new Date();
                const diffDays = Math.round((due - now) / (1000 * 60 * 60 * 24));
                let status = 'Completed';
                if (diffDays < 0) status = 'Overdue';
                else if (diffDays <= 30) status = 'Due Soon';
                return { dueDate: due.toISOString().split('T')[0], status, diffDays };
            }

            function renderVaccs() {
                const vaccs = Store.getAll('vaccinations');
                const list = document.getElementById('vaccList');
                if (!list) return;
                if (vaccs.length === 0) {
                    list.innerHTML = '<div class="empty-state"><i class="fas fa-syringe"></i><p>No vaccination records logged yet.</p></div>';
                    return;
                }
                list.innerHTML = vaccs.map(v => {
                    const statusClass = v.status === 'Completed' ? 'success' : (v.status === 'Due Soon' ? 'warning' : 'danger');
                    return `
                        <div style="padding:14px;background:var(--bg-glass);border-radius:var(--radius-sm);border:1px solid var(--border);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;">
                            <div>
                                <strong style="font-size:1.05rem;">${v.pet_name || 'Pet'}</strong> — ${v.vaccine_name}
                                <div style="font-size:0.8rem;color:var(--text-secondary);margin-top:4px;">
                                    Administered: ${v.last_date} &bull; Next Due: <strong>${v.next_due_date}</strong> (${v.diffDays >= 0 ? 'in ' + v.diffDays + ' days' : Math.abs(v.diffDays) + ' days overdue'})
                                </div>
                            </div>
                            <span class="badge badge-${statusClass}">${v.status}</span>
                        </div>
                    `;
                }).join('');
            }
            renderVaccs();

            const form = document.getElementById('vaccForm');
            if (form) {
                form.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const petId = petSelect.value;
                    const selectedPet = pets.find(p => String(p.id) === String(petId));
                    const [vName, vInterval] = document.getElementById('v_type').value.split('|');
                    const lastDate = document.getElementById('v_last_date').value;
                    const { dueDate, status, diffDays } = computeDue(lastDate, parseInt(vInterval, 10));

                    Store.save('vaccinations', {
                        pet_id: petId,
                        pet_name: selectedPet ? selectedPet.pet_name : 'Pet',
                        vaccine_name: vName,
                        last_date: lastDate,
                        next_due_date: dueDate,
                        status,
                        diffDays
                    });

                    form.reset();
                    document.getElementById('addVaccCard').style.display = 'none';
                    renderVaccs();
                    alert(`Vaccination logged! Next due date computed: ${dueDate} (${status})`);
                });
            }
        });
    </script>
</body>
</html>
