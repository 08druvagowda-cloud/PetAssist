<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — PetAssist</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="../js/store.js"></script>
    <script src="js/store.js"></script>
    <style>
        body.auth-page {
            background: radial-gradient(circle at 50% 20%, #161b31 0%, #0b0e1c 70%, #060810 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: 'Inter', sans-serif;
            color: #ffffff;
        }
        .auth-card {
            background: rgba(22, 27, 49, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.6);
            animation: popIn 0.3s ease-out;
        }
        @keyframes popIn {
            from { opacity: 0; transform: translateY(12px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .auth-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1.6rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 6px;
        }
        .auth-brand i { color: #6C63FF; }
        .demo-box {
            background: rgba(108, 99, 255, 0.08);
            border: 1px dashed rgba(108, 99, 255, 0.35);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 22px;
        }
        .demo-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #00D2D3;
            margin-bottom: 8px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .demo-btns {
            display: flex;
            gap: 8px;
        }
        .demo-btn {
            flex: 1;
            padding: 7px 10px;
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .demo-btn:hover {
            background: rgba(108, 99, 255, 0.3);
            border-color: #6C63FF;
        }
        .form-control {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            padding: 12px 14px 12px 40px;
            color: #fff;
            width: 100%;
            font-size: 0.95rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        .form-control:focus {
            outline: none;
            border-color: #6C63FF;
            box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.25);
        }
        .input-icon-wrapper {
            position: relative;
            margin-top: 6px;
        }
        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.95rem;
        }
        .btn-submit {
            background: linear-gradient(135deg, #6C63FF 0%, #5A52E0 100%);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 13px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 8px 24px rgba(108, 99, 255, 0.35);
            transition: transform 0.15s, box-shadow 0.15s;
            margin-top: 10px;
        }
        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 28px rgba(108, 99, 255, 0.5);
        }
        .alert-box {
            display: none;
            padding: 10px 14px;
            margin-bottom: 16px;
            border-radius: 8px;
            font-size: 0.88rem;
        }
        .alert-error {
            background: rgba(255, 82, 82, 0.15);
            border: 1px solid rgba(255, 82, 82, 0.4);
            color: #FF5252;
        }
        .alert-success {
            background: rgba(0, 200, 83, 0.15);
            border: 1px solid rgba(0, 200, 83, 0.4);
            color: #00C853;
        }
    </style>
</head>
<body class="auth-page">
    
    <div class="auth-card">
        <div class="auth-header" style="text-align:center; margin-bottom:20px;">
            <div class="auth-brand">
                <i class="fas fa-paw"></i>
                <span>PetAssist</span>
            </div>
            <h2 style="font-size:1.35rem; font-weight:700; margin:6px 0 4px;">Welcome Back</h2>
            <p style="color:rgba(255,255,255,0.6); font-size:0.88rem; margin:0;">Sign in to your clinical care workspace</p>
        </div>

        <!-- Quick 1-Click Demo Login Bar -->
        <div class="demo-box">
            <div class="demo-title">
                <i class="fas fa-bolt"></i> Quick One-Click Demo Sign-In
            </div>
            <div class="demo-btns">
                <button type="button" class="demo-btn" onclick="quickLogin('user@petassist.com', 'user123')">
                    <i class="fas fa-user"></i> Pet Parent
                </button>
                <button type="button" class="demo-btn" onclick="quickLogin('admin@petassist.com', 'admin123')">
                    <i class="fas fa-shield-alt"></i> Admin
                </button>
            </div>
        </div>

        <div id="alertBox" class="alert-box"></div>

        <form id="loginForm">
            <div style="margin-bottom:16px;">
                <label style="font-size:0.85rem; font-weight:600; color:rgba(255,255,255,0.85);">Email Address</label>
                <div class="input-icon-wrapper">
                    <i class="fas fa-envelope input-icon"></i>
                    <input type="email" id="email" class="form-control" placeholder="user@petassist.com" required>
                </div>
            </div>
            <div style="margin-bottom:20px;">
                <label style="font-size:0.85rem; font-weight:600; color:rgba(255,255,255,0.85);">Password</label>
                <div class="input-icon-wrapper">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>
            </div>
            <button type="submit" class="btn-submit">Sign In to Dashboard</button>
        </form>

        <div style="text-align:center; margin-top:22px; font-size:0.9rem; color:rgba(255,255,255,0.6);">
            Don't have an account? <a href="register.html" id="linkRegister" style="color:#00D2D3; text-decoration:none; font-weight:600;">Create one free</a><br><br>
            <a href="../index.html" id="linkHome" style="color:rgba(255,255,255,0.5); font-size:0.85rem; text-decoration:none;">
                <i class="fas fa-arrow-left"></i> Back to Homepage
            </a>
        </div>
    </div>

    <script>
        // Resolve home and register links safely across directory roots
        const isPagesDir = window.location.pathname.includes('/pages/');
        const homeLink = document.getElementById('linkHome');
        const regLink = document.getElementById('linkRegister');
        if (homeLink) homeLink.href = isPagesDir ? '../index.html' : 'index.html';
        if (regLink) regLink.href = isPagesDir ? 'register.html' : (window.location.pathname.endsWith('.html') ? 'register.html' : 'pages/register.html');

        function quickLogin(email, password) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = password;
            executeLogin(email, password);
        }

        function executeLogin(email, pass) {
            const box = document.getElementById('alertBox');
            if (typeof Store === 'undefined') {
                box.className = 'alert-box alert-error';
                box.style.display = 'block';
                box.innerText = 'Store database failed to load. Please refresh the page.';
                return;
            }

            const result = Store.login(email, pass);
            if (result.success) {
                box.className = 'alert-box alert-success';
                box.style.display = 'block';
                box.innerText = 'Login successful! Redirecting to workspace...';
                
                setTimeout(() => {
                    const dest = (result.user && result.user.role === 'admin') ? 'admin.html' : 'dashboard.html';
                    window.location.href = isPagesDir ? dest : (window.location.pathname.endsWith('.html') ? dest : `pages/${dest}`);
                }, 400);
            } else {
                box.className = 'alert-box alert-error';
                box.style.display = 'block';
                box.innerText = result.error || 'Invalid email or password';
            }
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            executeLogin(email, pass);
        });
    </script>
</body>
</html>
